name: Feature request
description: Suggest an idea for PyRoboReplay
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that PyRoboReplay doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen? A CLI flag, a Python API addition, etc.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: checked-roadmap
    attributes:
      label: Checklist
      options:
        - label: I checked ROADMAP_HONEST.md and this isn't already listed as built-but-unexposed
          required: false
