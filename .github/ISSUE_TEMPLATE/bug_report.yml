name: Bug report
description: Report a problem with PyRoboReplay
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code to reproduce the issue.
      placeholder: |
        1. Run `pyroboreplay analyze mission.bag --detect-gaps`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PyRoboReplay version
      description: Output of `pyroboreplay --version` or `pip show pyroboreplay`
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version (`rustc --version`), Python version (`python --version`)
      placeholder: "e.g. macOS 15, rustc 1.97.1, Python 3.11"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/output
      render: shell
