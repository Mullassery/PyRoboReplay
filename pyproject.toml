[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyroboreplay"
version = "2.9.2"
description = "Forensic debugging platform for autonomous robots: causal analysis, multispectral sensor fusion, invisible object detection, and persistent world knowledge"
authors = [{name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}]
license = {text = "Proprietary License — Free to use with explicit attribution"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
]
keywords = [
    "robotics",
    "debugging",
    "mission-replay",
    "root-cause-analysis",
    "ros2",
    "observability",
    "fault-diagnosis",
    "autonomous-systems",
    "fleet-monitoring",
    "sla-enforcement",
    "time-travel-debugging",
]

[project.urls]
Homepage = "https://github.com/mullassery/pyroboreplay"
Repository = "https://github.com/mullassery/pyroboreplay.git"
Documentation = "https://github.com/mullassery/pyroboreplay"
Issues = "https://github.com/mullassery/pyroboreplay/issues"
Discussions = "https://github.com/mullassery/pyroboreplay/discussions"
Changelog = "https://github.com/mullassery/pyroboreplay/releases"

[tool.maturin]
# Mixed python/rust layout: `src/pyroboreplay/__init__.py` is the real,
# importable top-level package (`from pyroboreplay import Mission`); it
# re-exports everything from the compiled `pyroboreplay._core` submodule
# built from `src/lib.rs`'s `#[pymodule] fn _core`. `python-source = "src"`
# tells maturin where to find that package (it doesn't default-detect
# `src/pyroboreplay/`, only a top-level `pyroboreplay/`) — without it,
# maturin silently dropped `__init__.py` from the wheel entirely and
# `import pyroboreplay` returned a namespace package with none of the
# classes accessible (verified while diagnosing this).
python-source = "src"
module-name = "pyroboreplay._core"
bindings = "pyo3"
features = ["pyo3/extension-module"]

[tool.maturin.sdist]
include = ["README.md", "LICENSE", "CLAUDE.md"]
