[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyroboreplay"
version = "0.8.0"
description = "Time-travel debugger for robot fleets - replay and analyze missions from ROS 2 bag files with sensor visualization"
authors = [{name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Debuggers",
]
keywords = [
    "robotics",
    "debugging",
    "mission-replay",
    "ros2",
    "observability",
]

[project.urls]
Homepage = "https://github.com/mullassery/pyroboreplay"
Repository = "https://github.com/mullassery/pyroboreplay.git"
Documentation = "https://github.com/mullassery/pyroboreplay/wiki"
Issues = "https://github.com/mullassery/pyroboreplay/issues"

[tool.maturin]
module-name = "pyroboreplay"
features = ["pyo3/extension-module"]

[tool.maturin.sdist]
include = ["README.md", "LICENSE", "CLAUDE.md"]
